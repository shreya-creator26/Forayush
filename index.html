<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Ayush</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ffd6e0,#d6f0ff,#fce1ff);
  color:#333;
  overflow:hidden;
}

.start{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:10;
}
.start h2{color:#ff4d88;}

.container{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

h1{font-size:2.8em;}
p{font-size:1.3em;max-width:650px;}

.buttons{margin-top:30px;}
button{
  margin:5px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d88;
  color:white;
  cursor:pointer;
}

/* Pokemon */
.sticker{
  position:absolute;
  width:150px;
}
.s1{top:5%;left:5%;}
.s2{top:5%;right:5%;}
.s3{bottom:5%;left:5%;}
.s4{bottom:5%;right:5%;}
.s5{top:35%;left:2%;}
.s6{top:35%;right:2%;}
.s7{bottom:25%;left:20%;}
.s8{bottom:25%;right:20%;}

/* Gift */
.gift-box{
  width:140px;
  height:140px;
  position:relative;
  cursor:pointer;
}

.base{
  width:140px;
  height:90px;
  background:#ff4d88;
  position:absolute;
  bottom:0;
  border-radius:10px;
}

.lid{
  width:140px;
  height:50px;
  background:#ff80aa;
  position:absolute;
  top:0;
  border-radius:10px;
  transition:0.6s;
}

.gift-box.open .lid{
  transform:translateY(-70px) rotate(-20deg);
}

.final-text{
  font-size:2.5em;
  color:#ff4d88;
}
.from{
  margin-top:10px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="start" onclick="start()">
  <h2>Tap to start</h2>
</div>

<!-- MUSIC (no autoplay initially) -->
<iframe id="music" width="0" height="0"
src=""
allow="autoplay"></iframe>

<!-- Pokemon -->
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" class="sticker s1">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" class="sticker s2">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" class="sticker s3">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" class="sticker s4">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png" class="sticker s5">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/39.png" class="sticker s6">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/52.png" class="sticker s7">
<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png" class="sticker s8">

<div id="app" class="container"></div>

<script>

const steps = [
"Happyyy 21st Birthdayyy Ayush",
"I wish you nothing but all the good things and a lot of success in life Dil se",
"I will always be grateful to have you as a friend and if I ever hurt you I am genuinely sorry",
"I hope you enjoy your day. Thank you for everything. Once again Happy Birthday"
];

let page = 0;

function start(){
  document.querySelector(".start").style.display="none";

  // start music AFTER click
  document.getElementById("music").src =
    "https://www.youtube.com/embed/GvGvCTtAUqY?start=40&autoplay=1&loop=1&playlist=GvGvCTtAUqY";

  render();
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  if(page <= 3){
    let el = document.createElement(page === 0 ? "h1":"p");
    el.innerText = steps[page];
    app.appendChild(el);
  }

  if(page === 4){
    let box = document.createElement("div");
    box.className="gift-box";
    box.innerHTML=`<div class="lid"></div><div class="base"></div>`;
    box.onclick=()=>{ page = 5; render(); };
    app.appendChild(box);
  }

  if(page === 5){
    let box = document.createElement("div");
    box.className="gift-box open";
    box.innerHTML=`<div class="lid"></div><div class="base"></div>`;
    app.appendChild(box);

    let text = document.createElement("div");
    text.className="final-text";
    text.innerText="Happyyy Birthdayyy Ayush";

    let from = document.createElement("div");
    from.className="from";
    from.innerText="- from Shreya";

    app.appendChild(text);
    app.appendChild(from);
  }

  let btnWrap = document.createElement("div");
  btnWrap.className="buttons";

  if(page > 0){
    let prev = document.createElement("button");
    prev.innerText="Previous";
    prev.onclick=()=>{ page--; render(); };
    btnWrap.appendChild(prev);
  }

  if(page < 4){
    let next = document.createElement("button");
    next.innerText="Next";
    next.onclick=()=>{ page++; render(); };
    btnWrap.appendChild(next);
  }

  app.appendChild(btnWrap);
}

</script>

</body>
</html>
