<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happyyy Birthdayyy Ayush </title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  background:linear-gradient(135deg,#ffd6e0,#d6f0ff,#fce1ff);
}

/* BACKGROUND POKEMON ONLY (RELIABLE) */
.bg{
  position:fixed;
  inset:0;
  z-index:-1;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  opacity:0.25;
}

.bg img{
  width:160px;
  margin:10px;
}

/* START */
.start{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  z-index:10;
}
.start h2{color:#ff4d88;}

/* MAIN */
.container{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

h1{font-size:2.8em;}
p{font-size:1.3em;max-width:650px;}

button{
  margin:10px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4d88;
  color:white;
  cursor:pointer;
}

/* GIFT */
.gift-box{
  width:140px;
  height:140px;
  position:relative;
  cursor:pointer;
}

.base{
  width:140px;
  height:90px;
  background:#ff4d88;
  position:absolute;
  bottom:0;
  border-radius:10px;
}

.lid{
  width:140px;
  height:50px;
  background:#ff80aa;
  position:absolute;
  top:0;
  border-radius:10px;
  transition:0.6s;
}

.gift-box.open .lid{
  transform:translateY(-70px) rotate(-20deg);
}

.final-text{
  font-size:2.5em;
  color:#ff4d88;
}

.from{
  margin-top:10px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/133.png">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png">
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png">
</div>

<div class="start" onclick="start()">
  <h2>Hey Ayush… tap this </h2>
</div>

<!-- MUSIC -->
<iframe id="music" width="0" height="0" src="" allow="autoplay"></iframe>

<div id="app" class="container"></div>

<script>

const steps = [
"Happyyy 21st Birthdayyy Ayush",
"I wish you nothing but all the good things and a lot of success in life Dil se",
"I will always be grateful to have you as a friend and if I ever hurt you I am genuinely sorry",
"I hope you enjoy your day. Thank you for everything. Once again Happy Birthday"
];

let page = 0;

function start(){
  document.querySelector(".start").style.display="none";

  document.getElementById("music").src =
  "https://www.youtube.com/embed/GvGvCTtAUqY?start=40&autoplay=1&loop=1&playlist=GvGvCTtAUqY";

  render();
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML="";

  if(page <= 3){
    let el = document.createElement(page===0?"h1":"p");
    el.innerText = steps[page];
    app.appendChild(el);
  }

  if(page===4){
    let box=document.createElement("div");
    box.className="gift-box";
    box.innerHTML=`<div class="lid"></div><div class="base"></div>`;
    box.onclick=()=>{page=5;render();};
    app.appendChild(box);
  }

  if(page===5){
    let box=document.createElement("div");
    box.className="gift-box open";
    box.innerHTML=`<div class="lid"></div><div class="base"></div>`;
    app.appendChild(box);

    let text=document.createElement("div");
    text.className="final-text";
    text.innerText="Happyyy Birthdayyy Ayush";

    let from=document.createElement("div");
    from.className="from";
    from.innerText="- from Shreya";

    app.appendChild(text);
    app.appendChild(from);
  }

  let nav=document.createElement("div");

  if(page>0){
    let prev=document.createElement("button");
    prev.innerText="Previous";
    prev.onclick=()=>{page--;render();};
    nav.appendChild(prev);
  }

  if(page<4){
    let next=document.createElement("button");
    next.innerText="Next";
    next.onclick=()=>{page++;render();};
    nav.appendChild(next);
  }

  app.appendChild(nav);
}

</script>

</body>
</html>
